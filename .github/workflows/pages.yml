# Publicación del sitio de portafolio en GitHub Pages. SOLO manual (workflow_dispatch) y SOLO tras habilitar Pages en la configuración del repositorio (Settings → Pages → Source: GitHub Actions):
# publicar es una decisión del autor, no algo que ocurra con cada cambio.
name: Publicar sitio
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar saneamiento y cifras antes de publicar
        run: |
          python3 tools/check_showcase.py
          python3 tools/check_figures.py
      - name: Preparar carpeta del sitio
        run: mkdir -p _site && cp site/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
